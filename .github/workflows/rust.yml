name: Rust

on: [ push, pull_request ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Install Rust Stable
      uses: dtolnay/rust-toolchain@stable
    - name: Install typos
      uses: taiki-e/install-action@typos
    - name: Check typos
      run: typos .
    - name: Check code formatting
      run: cargo fmt --check

  tests:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Install LLVM 20
      run: |
        sudo apt update
        sudo apt install -y lsb-release wget software-properties-common gnupg
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 20
        sudo apt install -y llvm-20 llvm-20-dev clang-20 libpolly-20-dev
        sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-20 10
    - name: llvm-config
      run: llvm-config --version --bindir --libdir
    - name: Install Rust + nextest
      uses: moonrepo/setup-rust@v1
      with:
        bins: cargo-nextest
    - name: cargo clippy
      run: cargo clippy --tests -- -D warnings
    - name: Build
      run: cargo build --release --verbose
    - name: Run tests
      run: |
        cargo nextest run --release --verbose
  

